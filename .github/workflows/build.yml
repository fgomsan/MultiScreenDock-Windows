name: Build & Test MultiScreenDock for Windows

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore MultiScreenDock.sln

      - name: Run xUnit Test Suite
        run: dotnet test tests/MultiScreenDock.Tests/MultiScreenDock.Tests.csproj -c Release --verbosity normal

      - name: Publish Native Windows x64 Single-File Executable
        run: |
          dotnet publish src/MultiScreenDock.App/MultiScreenDock.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/win-x64
          Compress-Archive -Path publish/win-x64/MultiScreenDock.exe -DestinationPath MultiScreenDock-v1.5.0-Windows-x64.zip -Force

      - name: Publish Native Windows ARM64 Single-File Executable
        run: |
          dotnet publish src/MultiScreenDock.App/MultiScreenDock.App.csproj `
            -c Release `
            -r win-arm64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/win-arm64
          Compress-Archive -Path publish/win-arm64/MultiScreenDock.exe -DestinationPath MultiScreenDock-v1.5.0-Windows-arm64.zip -Force

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MultiScreenDock-Windows-Binaries
          path: |
            MultiScreenDock-v1.5.0-Windows-x64.zip
            MultiScreenDock-v1.5.0-Windows-arm64.zip

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag MultiScreenDock-v1.5.0-Windows-x64.zip MultiScreenDock-v1.5.0-Windows-arm64.zip --title "MultiScreenDock for Windows $tag" --generate-notes
