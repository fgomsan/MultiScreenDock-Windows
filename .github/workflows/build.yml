name: Build & Test MultiScreenDock for Windows

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore MultiScreenDock.sln

      - name: Run xUnit Test Suite
        run: dotnet test tests/MultiScreenDock.Tests/MultiScreenDock.Tests.csproj -c Release --verbosity normal

      - name: Publish Native Windows x64 Single-File Executable & MSIX
        run: |
          dotnet publish src/MultiScreenDock.App/MultiScreenDock.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/win-x64
          Compress-Archive -Path publish/win-x64/MultiScreenDock.exe -DestinationPath MultiScreenDock-v1.5.0-Windows-x64.zip -Force

          New-Item -ItemType Directory -Force -Path msix_stage_x64/Assets | Out-Null
          Copy-Item publish/win-x64/MultiScreenDock.exe msix_stage_x64/MultiScreenDock.exe
          Copy-Item packaging/msix/Assets/*.png msix_stage_x64/Assets/
          $manifest = Get-Content packaging/msix/Package.appxmanifest -Raw
          $manifest = $manifest.Replace('ProcessorArchitecture="neutral"', 'ProcessorArchitecture="x64"')
          Set-Content -Path msix_stage_x64/AppxManifest.xml -Value $manifest -Encoding UTF8

          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $makeappx pack /d msix_stage_x64 /p MultiScreenDock-v1.5.0-x64.msix /o

      - name: Publish Native Windows ARM64 Single-File Executable & MSIX
        run: |
          dotnet publish src/MultiScreenDock.App/MultiScreenDock.App.csproj `
            -c Release `
            -r win-arm64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/win-arm64
          Compress-Archive -Path publish/win-arm64/MultiScreenDock.exe -DestinationPath MultiScreenDock-v1.5.0-Windows-arm64.zip -Force

          New-Item -ItemType Directory -Force -Path msix_stage_arm64/Assets | Out-Null
          Copy-Item publish/win-arm64/MultiScreenDock.exe msix_stage_arm64/MultiScreenDock.exe
          Copy-Item packaging/msix/Assets/*.png msix_stage_arm64/Assets/
          $manifest = Get-Content packaging/msix/Package.appxmanifest -Raw
          $manifest = $manifest.Replace('ProcessorArchitecture="neutral"', 'ProcessorArchitecture="arm64"')
          Set-Content -Path msix_stage_arm64/AppxManifest.xml -Value $manifest -Encoding UTF8

          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $makeappx pack /d msix_stage_arm64 /p MultiScreenDock-v1.5.0-arm64.msix /o

      - name: Upload Windows Build Artifacts (.zip + .msix)
        uses: actions/upload-artifact@v4
        with:
          name: MultiScreenDock-Windows-Binaries
          path: |
            MultiScreenDock-v1.5.0-Windows-x64.zip
            MultiScreenDock-v1.5.0-Windows-arm64.zip
            MultiScreenDock-v1.5.0-x64.msix
            MultiScreenDock-v1.5.0-arm64.msix

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release upload $tag MultiScreenDock-v1.5.0-Windows-x64.zip MultiScreenDock-v1.5.0-Windows-arm64.zip MultiScreenDock-v1.5.0-x64.msix MultiScreenDock-v1.5.0-arm64.msix --clobber
